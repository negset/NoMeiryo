<!DOCTYPE html>
<html language="ja">
  <head>
    <meta charset="UTF-8" />
    <title>NO メイリオ ― 設定</title>
    <link rel="stylesheet" href="options.css" />
    <script type="module" src="options.js"></script>
  </head>
  <body>
    <div id="title">NO メイリオ ― 設定</div>
    <p>メイリオを置き換えるフォントを指定してください。</p>
    <ul>
      <li>フォント名は完全名を入力してください。</li>
      <li>コンピュータにインストールされたフォントを指定してください。</li>
      <li>例: 「Noto Sans JP」「BIZ UDゴシック」「Yu Gothic UI Regular」</li>
    </ul>
    <label>
      フォント名 :
      <input id="font-name" type="text" />
    </label>
    <button id="save">保存</button>
    <span id="status"></span>
    <div id="copyright">&copy; 2019 negset</div>
  </body>
</html>
